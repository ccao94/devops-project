name: CI
on:
  push:
    branches: [feature/CiPipeline]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .
