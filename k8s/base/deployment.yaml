apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/ccao94/devops-project:local
          # image loaded with kind load, so no pull from GHCR
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080